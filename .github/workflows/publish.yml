name: Build and Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install system deps (EGL/GLU for pyrender)
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libglu1-mesa libegl1-mesa-dev

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Compute new version
      id: bump
      run: |
        CURRENT=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
        case "${{ inputs.bump }}" in
          major) NEW="$((MAJ + 1)).0.0" ;;
          minor) NEW="$MAJ.$((MIN + 1)).0" ;;
          patch) NEW="$MAJ.$MIN.$((PAT + 1))" ;;
        esac
        echo "Bumping $CURRENT → $NEW"
        echo "version=$NEW" >> $GITHUB_OUTPUT
        echo "current=$CURRENT" >> $GITHUB_OUTPUT

    - name: Apply version bump
      run: |
        sed -i "s/^version = \".*\"/version = \"${{ steps.bump.outputs.version }}\"/" pyproject.toml
        sed -i "s/__version__ = \".*\"/__version__ = \"${{ steps.bump.outputs.version }}\"/" mvmp/__init__.py

    - name: Build
      run: uv build

    - name: Commit version bump and tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pyproject.toml mvmp/__init__.py
        git commit -m "Bump version to v${{ steps.bump.outputs.version }}"
        git tag "v${{ steps.bump.outputs.version }}"
        git push origin main --tags

    - name: Publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: uv publish
